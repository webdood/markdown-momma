<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#f9f9f9" rx="20"/>
  
  <!-- Document/Notebook body -->
  <rect x="28" y="20" width="72" height="88" fill="#ffffff" rx="4" stroke="#ff6b95" stroke-width="2.5"/>
  
  <!-- Spine/binding (left edge) -->
  <rect x="28" y="20" width="6" height="88" fill="#ff6b95" rx="4"/>
  
  <!-- Ruled lines (text simulation) -->
  <line x1="42" y1="35" x2="92" y2="35" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="92" y2="48" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="61" x2="92" y2="61" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="74" x2="92" y2="74" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Pen/brush stroke accent (diagonal) -->
  <g transform="translate(75, 80) rotate(-20)">
    <ellipse cx="0" cy="0" rx="8" ry="14" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="-10" cy="-5" r="3" fill="#a78bfa" opacity="0.6"/>
  </g>
  
  <!-- Shine/highlight -->
  <circle cx="50" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
